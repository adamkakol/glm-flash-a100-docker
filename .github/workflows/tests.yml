name: Deployment scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install media test dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Existing GLM tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - name: Qwen tests without weights or GPUs
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s models/qwen3.8-27b/tests -v

  proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Real HAProxy streaming and admission tests
        env:
          QWEN_TEST_HAPROXY_IMAGE: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
        run: |
          docker pull "$QWEN_TEST_HAPROXY_IMAGE"
          trap 'docker image rm "$QWEN_TEST_HAPROXY_IMAGE" || true' EXIT
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s models/qwen3.8-27b/tests -p test_gateway_integration.py -v
