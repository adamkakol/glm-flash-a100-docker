name: glm-flash-a100
services:
  server:
    image: glm-flash-a100:tabby-f07131c-exl3-1.5.1
    build:
      context: .
    platform: linux/amd64
    user: "${LOCAL_UID:?Run configure.py first}:${LOCAL_GID:?Run configure.py first}"
    init: true
    restart: unless-stopped
    stop_grace_period: 90s
    shm_size: "16gb"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    environment:
      # UUIDs keep CUDA order stable. Logical devices 0 and 1 are the NVLink pair.
      CUDA_VISIBLE_DEVICES: "${GPU0_UUID:?},${GPU1_UUID:?},${GPU2_UUID:?}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NCCL_DEBUG: WARN
      EXPECTED_GPU_UUIDS: "${GPU0_UUID:?},${GPU1_UUID:?},${GPU2_UUID:?}"
      HF_HUB_DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - type: bind
        source: ./config.yml
        target: /app/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./secrets/api_tokens.yml
        target: /app/api_tokens.yml
        read_only: true
        bind:
          create_host_path: false
      - ./data/models:/models
      - ./data/cache:/cache
      - ./data/logs:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU0_UUID:?}", "${GPU1_UUID:?}", "${GPU2_UUID:?}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "/deploy/healthcheck.py"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30m
